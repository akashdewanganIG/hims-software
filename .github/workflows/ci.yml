name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:password@localhost:5433/hims_simulation
  DIRECT_URL: postgresql://postgres:password@localhost:5433/hims_simulation

jobs:
  checks:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Browser mode: these jobs need no database.
      DATABASE_URL: ""
      DIRECT_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore Next.js incremental build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('app/**/*.[jt]s', 'app/**/*.[jt]sx', 'components/**/*.[jt]s', 'components/**/*.[jt]sx', 'features/**/*.[jt]s', 'features/**/*.[jt]sx', 'lib/**/*.[jt]s', 'lib/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check-types
      - name: Lint source
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run unit and integration tests
        run: npm test
      - name: Verify deterministic simulation
        run: npm run verify:sim
      - name: Migrations match lib/server/db/schema.ts
        run: |
          npx drizzle-kit check
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "Schema changed without a migration: run npm run db:generate and commit ./drizzle"
            exit 1
          fi
      - name: Build production application
        run: npm run build
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-build-diagnostics
          path: |
            .next/trace
            .next/diagnostics
          if-no-files-found: ignore

  database:
    name: PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hims_simulation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hims_simulation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Seed PostgreSQL
        run: npm run db:seed
      - name: Verify PostgreSQL dataset
        run: npm run db:verify
      - name: Run PostgreSQL operation suite
        run: npm run test:db
      - name: The same suite through Neon's serverless driver
        run: npm run test:db:neon

  e2e:
    name: End-to-end (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hims_simulation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hims_simulation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SESSION_SECRET: ci-only-session-secret-not-for-real-use-0123456789
      E2E_BROWSER: chrome
      E2E_BASE_URL: http://localhost:3002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore Next.js incremental build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('app/**/*.[jt]s', 'app/**/*.[jt]sx', 'components/**/*.[jt]s', 'components/**/*.[jt]sx', 'features/**/*.[jt]s', 'features/**/*.[jt]sx', 'lib/**/*.[jt]s', 'lib/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Build production application
        run: npm run build
      - name: Start the app
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:3002/api/health && exit 0
            sleep 2
          done
          cat server.log
          exit 1
      - name: Run end-to-end role journeys
        run: npm run e2e
      - name: Upload end-to-end logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            .e2e
            server.log
          if-no-files-found: ignore
